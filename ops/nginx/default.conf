server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

  # Página 404 servida con HTTP 404 real
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # Rutas SPA conocidas: sirven index.html con 200
  location = / {
    try_files /index.html =404;
  }

  location = /workspace {
    try_files /index.html =404;
  }

  location = /workspace/ {
    try_files /index.html =404;
  }

  # Resto: solo se sirve si el archivo/directorio existe;
  # si no, =404 dispara la página 404 con código 404 real.
  location / {
    try_files $uri $uri/ =404;
  }
}
